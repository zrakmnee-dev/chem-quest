<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff8a1f">
<title>乙4クエスト｜危険物取扱者 乙種第4類</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-column game — sticky status bar, vertical stage map, sheet to start; play screen reuses the step drill */
/* Visual world: a periodic table on deep navy — stages are element tiles, chapters are periods, each chapter has its own group color */
:root{
  --bg:#0d1524; --surface:#142035; --surface2:#1a2942; --ink:#e8eef8; --muted:#8fa0bb; --line:#24365a;
  --accent:#62b6ff; --accent-soft:#18304f; --on:#07111f;
  --ok:#5fd39a; --ok-soft:#163a2e; --warn:#f4a259; --warn-soft:#3a2a1a;
  --gold:#f5c84b; --gold-soft:#3a3218; --boss:#c79bff; --boss-soft:#2c2245; --heart:#ff6b81;
  --font-display:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:"BIZ UDGothic","BIZ UDPGothic",ui-monospace,monospace;
  --glow:#16243d; --hero1:#1a3358; --hero2:#2b2150;
  color-scheme:dark;
}
:root[data-skin="light"]{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#eef2f8; --ink:#131b2c; --muted:#5a6782; --line:#d9e0ec;
  --accent:#1f6fd6; --accent-soft:#e2edfc; --on:#ffffff;
  --ok:#138a5a; --ok-soft:#dcf2e7; --warn:#c06a10; --warn-soft:#fcebd6;
  --gold:#e0a400; --gold-soft:#fbf0cc; --boss:#7b3fd1; --boss-soft:#efe6fb; --heart:#d8344f;
  --glow:#e6eefb; --hero1:#e3edfc; --hero2:#efe6fb;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;min-height:100vh}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* status bar */
.status{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.status .row{display:flex;align-items:center;gap:12px}
.goal{flex:1;min-width:0}
.goal .t{font-family:var(--font-display);font-size:15px;display:flex;justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--boss));border-radius:4px}
.chip{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.chip svg{width:20px;height:20px}
.chip.fire{color:var(--warn)}
.chip.xp{color:var(--gold)}
.chip.off{color:var(--muted)}
.quick{display:flex;gap:8px;margin-top:10px}
.quick .btn{flex:1;font-size:14px;padding:9px 10px}
/* map */
.banner{margin:18px 0 8px;border-radius:10px;padding:12px 14px;background:var(--accent);color:var(--on);display:flex;justify-content:space-between;align-items:center}
:root[data-theme="dark"] .banner{color:#0f1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner{color:#0f1220}}
.banner .c{font-size:13.5px;opacity:.85;font-weight:700}
.banner h2{font-size:17px}
.banner .p{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.banner.done{background:var(--ok)}
.banner.lock{background:var(--line);color:var(--muted)}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px;transform:translateX(var(--x,0))}
.node .disc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on);box-shadow:none;font-family:var(--font-display);font-size:22px}
.node.done .disc{background:var(--gold);box-shadow:none}
.node.lock .disc{background:var(--line);color:var(--muted);box-shadow:none}
.node.boss .disc{width:86px;height:86px;background:var(--boss);box-shadow:none}
.node.boss.lock .disc{background:var(--line)}
.node.boss.done .disc{background:var(--ok);box-shadow:none}
.node .disc svg{width:70%;height:70%}
.node .lbl{font-size:13.5px;font-weight:700;max-width:130px;text-align:center;line-height:1.3}
.node.lock .lbl{color:var(--muted)}
.stars{display:flex;gap:1px;height:14px}
.stars svg{width:14px;height:14px}
.node.cur .disc{outline:4px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:4px}
.node.cur::before{content:"ここから";position:absolute;top:-22px;font-size:13.5px;font-weight:700;background:var(--surface);border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:0 8px}
@media (prefers-reduced-motion: no-preference){ .node.cur .disc{animation:bob 1.6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-4px)}} }
.finish{text-align:center;padding:16px 0 4px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .card{width:100%;max-width:560px;border-radius:10px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .kind{font-size:13.5px;font-weight:700;color:var(--muted)}
.sheet .kind.b{color:var(--boss)}
/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--on);box-shadow:none}
:root[data-theme="dark"] .btn{color:#0f1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0f1220}}
.btn.boss{background:var(--boss);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line);box-shadow:none}
.btn.text{background:none;color:var(--muted);padding:8px 4px;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.full{width:100%}
/* play */
.playtop{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0}
.playtop .bar{flex:1;height:12px;margin:0;border-radius:6px}
.playtop .bar i{background:var(--ok)}
.hearts{display:flex;gap:2px}
.hearts svg{width:20px;height:20px}
.bossbox{display:flex;align-items:center;gap:12px;background:var(--boss-soft);border-radius:10px;padding:12px}
.bossbox .face{width:64px;height:64px;flex:none}
.bossbox .name{font-family:var(--font-display);font-size:16px;color:var(--boss)}
.hp{height:10px;background:var(--surface);border-radius:5px;overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;background:var(--heart);transition:width .4s}
.q{font-size:17px}
.ref{margin-top:10px;font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.eq{font-family:var(--font-display);font-size:18px;text-align:center;padding:4px 0 8px}
.tag{display:inline-block;font-size:13.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.tag.f{background:var(--boss-soft);color:var(--boss)}
.tbl{border-collapse:collapse;margin:10px 0 0;font-size:14px;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.tbl th{background:var(--bg);font-size:13.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.step.done{border-color:var(--ok);background:var(--ok-soft)}
.step.locked{opacity:.5}
.step .lab{font-size:14px;font-weight:700;color:var(--muted)}
.step.done .lab{color:var(--ok)}
.step .res{margin-top:4px;font-size:14px}
.ansrow{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:18px;font-variant-numeric:tabular-nums}
.ansrow input.exp{flex:0 0 72px}
.ansrow .x10{font-size:17px;white-space:nowrap}
.ansrow .x10 sup{font-size:13.5px}
.ansrow .unitlab{font-size:14px;color:var(--muted);white-space:nowrap}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices .btn{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.fb{margin-top:10px;font-size:14px;border-radius:10px;padding:10px 12px}
.fb.bad{background:var(--warn-soft)}
.fb.bad b{color:var(--warn)}
.fb.hint{background:var(--accent-soft)}
.fb.hint b{color:var(--accent)}
.pdone{text-align:center}
.pdone h2{font-size:20px}
.pdone.ok h2{color:var(--ok)}
.pdone.meh h2{color:var(--warn)}
.big{font-family:var(--font-display);font-size:22px;padding:4px 0}
.sol{margin:10px 0 0;padding-left:20px;text-align:left;font-size:14px}
.sol li{margin:4px 0}
/* summary */
.sum{text-align:center;padding-top:24px}
.sum .hero{width:120px;height:120px;margin:0 auto}
.sum h1{font-size:26px;margin-top:8px}
.sum .bigstars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.sum .bigstars svg{width:44px;height:44px}
.gains{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.gain{border:2px solid var(--line);border-radius:12px;padding:8px}
.gain b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.gain span{font-size:13.5px;color:var(--muted)}
.gain.x{border-color:var(--gold)} .gain.x b{color:var(--gold)}
.gain.s{border-color:var(--warn)} .gain.s b{color:var(--warn)}
.gain.c{border-color:var(--ok)} .gain.c b{color:var(--ok)}
/* time attack */
.ta-hero{background:linear-gradient(135deg,var(--accent),var(--boss));color:var(--on);border-radius:10px;padding:16px}
:root[data-theme="dark"] .ta-hero{color:#0f1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ta-hero{color:#0f1220}}
.ta-hero h1{font-size:22px}
.ta-hero p{margin:4px 0 0;font-size:14px;opacity:.9}
.rules{margin:0;padding-left:18px;font-size:14px}
.rules li{margin:2px 0}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.types span{font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
.lb{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.lb td{padding:7px 4px;border-bottom:1px solid var(--line)}
.lb tr:last-child td{border-bottom:0}
.lb td.r{width:36px;font-weight:700;color:var(--muted);text-align:center}
.lb td.t{text-align:right;font-weight:700}
.lb tr.me td{background:var(--accent-soft)}
.lb tr.top1 td.r{color:var(--gold)}
.timer{font-family:var(--font-display);font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pen{font-size:14px;color:var(--heart);font-weight:700;min-height:18px}
.count{font-family:var(--font-display);font-size:96px;text-align:center;padding:80px 0;color:var(--accent)}
.nick{display:flex;gap:8px}
.nick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.flash{color:var(--ok);font-weight:700}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.has-tabs{padding-bottom:96px}
.apphead{display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px}
.apphead h1{font-size:20px}
.lvl{font-size:13.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
/* home */
.greet{display:flex;gap:12px;align-items:center}
.greet .m{width:64px;height:64px;flex:none}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.bubble::before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.next{background:var(--accent);color:var(--on);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:none}
:root[data-theme="dark"] .next{color:#0f1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .next{color:#0f1220}}
.next.boss{background:var(--boss);box-shadow:none}
.next .k{font-size:13.5px;font-weight:700;opacity:.85}
.next h2{font-size:22px}
.next .btn{background:#fff;color:var(--accent);box-shadow:none;font-size:17px}
.next.boss .btn{color:var(--boss)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.mini b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.mini span{font-size:13.5px;color:var(--muted)}
.mini .ic{width:40px;height:40px;flex:none}
.mini.fire .ic{color:var(--warn)}
.ring{width:44px;height:44px;flex:none}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mission:last-of-type{border-bottom:0}
.mission .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--on)}
.mission.ok .chk{background:var(--ok);border-color:var(--ok)}
.mission .body{flex:1;min-width:0}
.mission .t{font-size:14px;font-weight:700}
.mission .bar{height:6px;margin-top:4px}
.mission .bar i{background:var(--gold)}
.mission .n{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sec-h b{font-size:15px}
.rowcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rowcard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.rowcard .ic svg{width:24px;height:24px}
.rowcard .body{flex:1;min-width:0}
.rowcard .t{font-weight:700}
.rowcard .d{font-size:13.5px;color:var(--muted)}
.rowcard .go{color:var(--muted);font-size:20px}
/* me */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 65%,var(--line))}
.heat i.l3{background:var(--ok)}
.heat i.t{outline:2px solid var(--accent);outline-offset:1px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:4px}
.chrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chrow:last-child{border-bottom:0}
.chrow .bar{grid-column:1/-1;height:6px;margin:0}
.chrow .n{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* onboarding & settings */
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 0}
.ob .m{width:120px;height:120px;margin:0 auto}
.ob h1{font-size:26px;text-align:center}
.ob p.lead{text-align:center;color:var(--muted);margin:0}
.pick{display:flex;flex-direction:column;gap:10px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px}
.pick button b{font-size:16px}
.pick button span{font-size:14px;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:4px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.danger{color:var(--heart)!important;border-color:var(--heart)!important}
/* mastery & drill */
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ok)}
.pips.big i{width:22px;height:10px;border-radius:3px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
.mrow:last-child{border-bottom:0}
.mrow .t{flex:1;min-width:0;font-weight:700;font-size:15px}
.mrow .t small{display:block;font-weight:400;font-size:13.5px;color:var(--muted)}
.mrow .due{font-size:13.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.mname{font-size:13.5px;color:var(--muted);min-width:52px;text-align:right}
.combo{font-weight:700;color:var(--warn);font-size:14px;display:flex;align-items:center;gap:2px}
.combo svg{width:18px;height:18px}
.mode{font-size:13.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.mode.d{background:var(--boss-soft);color:var(--boss)}
.promo{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:700;background:var(--boss-soft);color:var(--boss)}
.promo.back{background:var(--accent-soft);color:var(--accent)}
/* keypad */
.kp{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.kp .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line);touch-action:manipulation}
.kp button:active{transform:translateY(1px);box-shadow:none}
.kp button.fn{font-size:15px;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.kp button.ok{grid-column:span 2;background:var(--accent);color:var(--on);border-color:transparent;font-size:17px}
:root[data-theme="dark"] .kp button.ok{color:#0f1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kp button.ok{color:#0f1220}}
.kp button:disabled{opacity:.35}
.has-kp{padding-bottom:300px}
.ansrow input.act{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.sig{font-size:13.5px;color:var(--muted);margin-top:4px}
.rep{background:none;border:0;padding:4px 0;margin-top:6px;font-size:13.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.reasons{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.reasons button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:14px}
.reasons button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.sheet textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font:inherit}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
.banner .skip{background:#fff;color:var(--accent);border:0;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:700;margin-top:6px}
/* university report */
.u-search{display:flex;gap:8px}
.u-search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font:inherit;color:var(--ink)}
.u-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.u-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.badge{display:inline-block;font-size:13.5px;font-weight:700;border-radius:4px;padding:2px 8px}
.badge.cur{background:var(--ok-soft);color:var(--ok)}
.badge.ai{background:var(--warn-soft);color:var(--warn)}
.fmt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.fmt dt{color:var(--muted);font-size:13.5px;padding-top:2px}
.fmt dd{margin:0}
.wrow{display:grid;grid-template-columns:1fr 70px 64px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.wrow:last-child{border-bottom:0}
.wrow small.yc{display:block;font-size:13.5px;color:var(--muted)}
.wrow .w{font-family:var(--font-mono);color:var(--gold);letter-spacing:1px;font-size:14px}
.gap{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:0}
.gap .t{flex:1;min-width:0;font-weight:700;font-size:14px}
.gap .t small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.lockcta{border:1.5px dashed var(--boss);border-radius:10px;padding:14px;background:var(--boss-soft)}
.lockcta h3{font-size:16px;color:var(--boss)}
.usugs{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:340px;overflow:auto}
.usug{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.usug b{display:block;font-size:14px}.usug small{color:var(--muted);font-size:13.5px}
.usug.ai{border-style:dashed}
.u-chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge.gen{background:var(--surface-2,var(--line));color:var(--muted)}
.u-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.u-tags span{font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
details.yr{border-top:1px solid var(--line);padding:8px 0}details.yr summary{font-weight:700;font-size:14px;cursor:pointer}
details.yr ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}details.yr li{font-size:14px}
.tchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tchip{font-size:13.5px;border-radius:5px;padding:1px 7px;background:var(--accent-soft,var(--ok-soft));color:var(--accent)}.tchip.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
.srow{display:grid;grid-template-columns:22px 1fr 90px;gap:8px;align-items:center;padding:5px 0;font-size:14px}.srow .num{font-family:var(--font-mono);color:var(--muted)}
.sbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.sbar i{display:block;height:100%;background:var(--accent)}
.stop .hot{display:inline-block;font-size:13.5px;font-weight:700;color:var(--boss);border:1px solid var(--boss);border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}.stop .hot.wk{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.wgoal{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}.wg-h{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}.wg-sub{font-size:13.5px;color:var(--muted);margin-top:6px}
.wgoal .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.wgoal .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pace{font-size:13.5px;font-weight:700;margin-left:6px;padding:0 5px;border-radius:4px}.pace.ok{color:var(--ok);border:1px solid var(--ok)}.pace.ng{color:var(--warn);border:1px solid var(--warn)}
.wlast{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--accent-soft, var(--line));font-size:14px}.wlast b{margin-bottom:2px}
.habit{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:14px}.habit b{display:block;color:var(--warn);margin-bottom:2px}
.stop .hot.s{color:var(--muted);border-color:var(--line)}
.src{font-size:13.5px;color:var(--muted)}
.src a{color:var(--accent)}
.disc{font-size:13.5px;color:var(--muted);line-height:1.6}
/* free list */
.course{font-family:var(--font-display);font-size:14px;color:var(--accent);letter-spacing:.08em;margin-top:10px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list h3{font-size:14px;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.row-u{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;font-weight:700;font-size:15px}
.row-u:last-child{border-bottom:0}
.row-u span{font-size:13.5px;color:var(--muted);font-weight:400}

/* ===== periodic table ===== */
:root[data-skin="light"] .btn,:root[data-skin="light"] .kp button.ok,:root[data-skin="light"] .next .btn{color:var(--on)}
:root[data-skin="light"] .btn.ghost,:root[data-skin="light"] .btn.text{color:var(--accent)}
:root[data-skin="light"] .btn.text{color:var(--muted)}
:root[data-skin="light"] .choices .btn{color:var(--ink)}
body{background:radial-gradient(1200px 600px at 50% -200px,var(--glow) 0%,var(--bg) 60%) fixed,var(--bg)}
.btn{border-radius:8px;letter-spacing:.02em}
.card,.mini,.rowcard,.list,.chap,.stat,.gain{border-radius:10px}
.timer,.gain b,.mini b,.stat b,.lvl,.daycount{font-family:var(--font-mono)}
.period{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.period .pn{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.period h2{font-size:16px;flex:1}
.period .p{font-family:var(--font-mono);font-size:13.5px;color:var(--muted)}
.period .bar{width:56px;height:4px;margin:0}
.period .bar i{background:var(--c)}
.ptable{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.el{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:84px;padding:5px 6px 6px;border-radius:6px;
  background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--ink)}
.el .z{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);line-height:1}
.el .sy{font-family:var(--font-mono);font-weight:700;font-size:23px;line-height:1.05;color:var(--c);margin-top:3px}
.el .nm{font-size:13.5px;line-height:1.25;color:var(--muted);margin-top:auto;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.el .dots{position:absolute;top:5px;right:5px;display:flex;gap:2px}
.el .dots i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--c) 25%,var(--line))}
.el .dots i.on{background:var(--gold)}
.el.done{background:color-mix(in srgb,var(--c) 24%,var(--surface));border-color:var(--c)}
.el.done .nm{color:var(--ink)}
.el.lock{opacity:.42;border-style:dashed;background:transparent}
.el.lock .sy{color:var(--muted)}
.el.cur{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent),0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
.el.cur .dots{display:none}
.el.cur::after{content:"NEXT";position:absolute;top:4px;right:4px;font-family:var(--font-mono);font-size:13.5px;font-weight:700;color:var(--on);background:var(--c);border-radius:3px;padding:0 4px}
@media (prefers-reduced-motion: no-preference){ .el.cur{animation:glow 2s ease-in-out infinite} @keyframes glow{50%{box-shadow:0 0 0 2px var(--c),0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}} }
.el.boss{grid-column:span 2;flex-direction:row;align-items:center;gap:10px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--surface)) 0 8px,color-mix(in srgb,var(--c) 10%,var(--surface)) 8px 16px)}
.el.boss .bx{display:flex;flex-direction:column;min-width:0}
.el.boss .tag2{font-family:var(--font-mono);font-size:13.5px;font-weight:700;letter-spacing:.08em;color:var(--c)}
.el.boss .nm{-webkit-line-clamp:2;color:var(--ink);font-size:13.5px;font-weight:700;margin-top:2px}
.el.boss .sy{font-size:30px;margin:0}
.el.boss.done{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
/* path map (one road, element-tile stops) */
.chband{margin:20px 0 10px;border-radius:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);display:flex;justify-content:space-between;align-items:center;gap:10px}
.chband .c{font-size:13.5px;font-weight:700;color:var(--c);letter-spacing:.04em}
.chband h2{font-size:17px}
.chband .p{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--muted)}
.chband.done{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.chband.lock{opacity:.6}
.chband .skip2{margin-top:6px;background:none;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:700}
.road{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 6px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px;transform:translateX(var(--x,0));color:var(--ink)}
.stop .t{width:70px;height:78px;border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;padding:5px 7px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.stop .t .z{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);line-height:1}
.stop .t .sy{font-family:var(--font-mono);font-weight:700;font-size:26px;color:var(--c);margin:auto;line-height:1}
.stop .t .ck{position:absolute;top:0;right:0}
.stop.boss .t{width:118px;height:84px;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,var(--surface)) 0 8px,color-mix(in srgb,var(--c) 12%,var(--surface)) 8px 16px)}
.stop.boss .t .sy{margin:0;font-size:30px}
.stop.boss .t .bt{font-family:var(--font-mono);font-size:13.5px;font-weight:700;color:var(--c);letter-spacing:.08em}
.stop.done .t{background:color-mix(in srgb,var(--c) 32%,var(--surface));border-color:var(--c)}
.stop.lock .t{opacity:.45;border-style:dashed;background:transparent}
.stop.lock .t .sy{color:var(--muted)}
.stop .lbl{font-size:13.5px;font-weight:700;max-width:150px;text-align:center;line-height:1.3}
.stop.lock .lbl{color:var(--muted)}
.stop .stars{height:14px}
.stop.cur .t{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent),0 0 24px color-mix(in srgb,var(--c) 50%,transparent)}
.stop.cur::before{content:"ここから";position:absolute;top:-20px;font-size:13.5px;font-weight:700;background:var(--c);color:var(--on);border-radius:6px;padding:0 8px;z-index:1}
@media (prefers-reduced-motion: no-preference){ .stop.cur .t{animation:bob 1.6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-4px)}} }
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:4px 0 0}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--accent)}
.next{background:var(--surface);color:var(--ink);border:1.5px solid var(--c,var(--accent));flex-direction:row;align-items:stretch;gap:14px}
.next .tile{width:92px;flex:none}
.next .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.next .k{color:var(--muted);opacity:1}
.next h2{font-size:19px}
.next .btn{background:var(--c,var(--accent));color:var(--on);margin-top:auto}
.next.boss{background:var(--surface)}
.next.boss .btn{color:var(--on)}
.banner{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.ta-hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--ink);border:1px solid var(--line)}
.ta-hero h1{color:var(--ink)}
.bossbox{background:var(--surface2);border:1px solid var(--line)}
.tabbar{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px)}
.status{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.bar i{background:linear-gradient(90deg,var(--accent),var(--boss))}
.mission .chk{color:var(--on)}
.next .tile svg,.greet .m svg,.sum .hero svg{width:100%;height:auto}
/* ===== v2: 藍の周期表 ===== */
/* Boldness lives in the map (a real periodic grid) and the home hero tile; everything else is quiet surfaces without outlines */
:root{
  --bg:#121a3f; --bg2:#0d1333; --surface:#1a2352; --surface2:#222d63; --line:#2f3b78; --ink:#eef0ff; --muted:#a2aad6;
  --accent:#8fb8ff; --accent-soft:#25336d; --on:#0d1333;
  --ok:#6be0a4; --ok-soft:#173d3c; --warn:#ffb36b; --warn-soft:#3d2f3a; --gold:#ffd166; --gold-soft:#3a3540; --boss:#c9a2ff; --boss-soft:#2e2a63; --heart:#ff7a90;
  --glow:#24306c; --hero1:#25336d; --hero2:#2e2a63;
}
:root[data-skin="light"]{
  --bg:#eef1ff; --bg2:#e4e8fb; --surface:#ffffff; --surface2:#f3f5ff; --line:#d9def5; --ink:#161c45; --muted:#5b6494;
  --accent:#3d5fd9; --accent-soft:#e3e9ff; --on:#ffffff;
  --ok:#10875a; --ok-soft:#dcf3e8; --warn:#c0610f; --warn-soft:#fdeedd; --gold:#c08a00; --gold-soft:#fbf1d2; --boss:#7344d1; --boss-soft:#eee7fd; --heart:#d8344f;
  --glow:#dfe5ff; --hero1:#e3e9ff; --hero2:#eee7fd;
}
body{background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 100vh) fixed,var(--bg);font-feature-settings:"palt" 1}
h1,h2,h3{font-weight:700;letter-spacing:.01em}
.card,.rowcard,.list,.mini,.gain{border:0;border-radius:16px;background:var(--surface)}
.card{padding:16px 16px}
.step{border:0;border-radius:14px;background:var(--surface)}
.step.done{background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.btn{border-radius:14px;font-weight:700;padding:13px 16px;background:var(--c,var(--accent));color:var(--on);box-shadow:0 3px 0 color-mix(in srgb,var(--c,var(--accent)) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--c,var(--accent)) 55%,#000)}
:root[data-skin="dark"] .btn{color:var(--on)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;border:0}
:root[data-skin="light"] .btn.ghost{color:var(--ink)}
.btn.text{box-shadow:none;background:none}
.btn.boss{--c:var(--boss)}
.choices .btn{background:var(--surface2);border:2px solid transparent;color:var(--ink);box-shadow:none;font-weight:700}
.choices .btn:hover{border-color:color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}
.apphead{padding:18px 0 2px}
.apphead h1{font-size:19px;letter-spacing:.04em}
.lvl{font-family:var(--font-display);background:var(--surface);color:var(--gold);font-size:14px;padding:4px 12px}
.hello{margin:2px 0 14px;font-size:14px;color:var(--muted)}
/* home hero */
.hero2{position:relative;border-radius:22px;padding:18px 16px 16px;background:
  radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 30%,transparent) 0,transparent 60%),var(--surface);overflow:hidden}
.hero2 .hrow{display:flex;gap:16px;align-items:center}
.bigtile{flex:none;width:112px;height:124px;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--c) 22%,var(--surface));border:2.5px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 14%,transparent),0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.bigtile .z{font-family:var(--font-mono);font-size:14px;color:var(--muted);line-height:1}
.bigtile .sy{font-family:var(--font-display);font-weight:900;font-size:50px;line-height:1;color:var(--c);margin:auto 0 2px;letter-spacing:-.02em}
.bigtile .nm{font-size:13.5px;color:var(--muted);line-height:1.3}
.bigtile.boss{padding:4px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.bigtile.boss .face{width:96px}
.bigtile.boss .face svg{width:100%;height:auto}
.hinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.hk{font-size:14px;color:var(--c);font-weight:700}
.hero2 h2{font-size:22px;line-height:1.3}
.strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.strip i{width:14px;height:14px;border-radius:3px;background:color-mix(in srgb,var(--c) 12%,var(--surface2));border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent)}
.strip i.b{width:22px}
.strip i.on{background:var(--c);border-color:var(--c)}
.strip i.cur{border-color:var(--ink);background:color-mix(in srgb,var(--c) 40%,var(--surface2))}
.hero2 .go{margin-top:16px;font-size:18px;padding:15px}
/* today */
.today{background:var(--surface);border-radius:18px;padding:14px 14px 10px}
.tstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ts{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ts b{font-family:var(--font-display);font-size:22px;line-height:1}
.ts > span:last-child{font-size:13.5px;color:var(--muted)}
.ts .ic{width:28px;height:28px;color:var(--muted)}
.ts.fire .ic,.ts.fire b{color:var(--warn)}
.ts .ring{width:30px;height:30px}
.ts.all b{color:var(--gold)}
.mlist{padding-top:4px}
.today .mission{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;border:0}
.today .mission .chk{width:20px;height:20px;font-size:13.5px}
.today .mission .t{font-size:14px;font-weight:600}
.today .mission.ok .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.mb{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px}
.rowcard{padding:12px 14px}
.rowcard .ic{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.rowcard .d{display:block}
.goalline{padding:6px 4px}
.gl-h{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.goalline .bar{margin-top:6px;height:6px}
.goalline p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.bar{background:color-mix(in srgb,var(--line) 70%,transparent)}
.bar i{background:var(--gold)}
/* week card */
.wgoal{border:0;background:var(--surface2);border-radius:12px}
.wgoal .bar i{background:var(--accent)}
.wlast{background:var(--surface2)}
.btn.text,:root[data-skin] .btn.text{color:var(--muted)}
.btn.ghost,:root[data-skin] .btn.ghost{color:var(--ink)}
.btn.ghost[data-focus]{color:var(--accent)}
/* map: periodic grid */
.period{display:block;margin:26px 0 0}
.period .ph{display:flex;align-items:baseline;gap:10px}
.period .pn{font-family:var(--font-display);font-size:13.5px;font-weight:700;color:var(--c);border:0;padding:0}
.period h2{font-size:18px;flex:1}
.period .pc{font-size:13.5px;color:var(--muted)}
.period .pp{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--muted)}
.period .pbar{height:3px;border-radius:2px;background:color-mix(in srgb,var(--c) 15%,transparent);margin:8px 0 10px;overflow:hidden}
.period .pbar i{display:block;height:100%;background:var(--c)}
.period.lock h2,.period.lock .pn{color:var(--muted)}
.period .skip2{margin:0 0 10px;background:none;border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700}
.ptable{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.el{min-height:92px;padding:6px 7px 7px;border-radius:9px;font:inherit;cursor:pointer;
  background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent)}
.el .z{font-size:13.5px}
.el .sy{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:-.02em;margin-top:4px}
.el .sy svg{width:20px;height:20px;color:var(--muted)}
.el .nm{font-size:13.5px;padding-right:16px}
.el .dots{position:absolute;top:auto;bottom:6px;right:6px;gap:2px}
.el .dots i{width:5px;height:5px}
.el .bdg{position:absolute;top:5px;right:5px;line-height:1}
.el .bdg .hot{display:inline-block;font-size:13.5px;font-weight:700;border-radius:3px;padding:1px 4px;color:var(--c);border:1px solid var(--c);background:var(--surface)}
.el .bdg .hot.s{color:var(--muted);border-color:var(--line)}
.el .bdg .hot.wk{color:var(--on);background:var(--accent);border-color:var(--accent)}
.el.done{background:color-mix(in srgb,var(--c) 28%,var(--surface));border-color:var(--c)}
.el.done .z{color:color-mix(in srgb,var(--ink) 70%,transparent)}
.el.lock{opacity:.5;border-style:dashed;background:transparent}
.el.cur::after{content:"次はここ";font-family:var(--font-body);font-size:13.5px;padding:1px 5px;border-radius:4px;top:-9px;right:6px}
.el.cur .bdg{display:none}
.el.boss{grid-column:span 2;min-height:92px;gap:10px;padding:8px 10px}
.el.boss .sy{font-size:30px;margin:0;color:var(--c)}
.el.boss .tag2{font-family:var(--font-body);letter-spacing:0;font-size:13.5px}
.el .lk{position:absolute;right:5px;bottom:5px;width:14px;height:14px;color:var(--muted)}
.el .lk svg{width:14px!important;height:14px!important;display:block}
.el.lock{opacity:.62}
.el.lock .sy{color:color-mix(in srgb,var(--c) 45%,var(--muted))}
.el.boss .sy{flex:none}
.el:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.route{background:var(--surface)}
/* status bar */
.status{border-bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent)}
/* play */
.playtop .bar i{background:var(--c,var(--ok))}
.qcard{border-top:4px solid var(--c,var(--accent))}
.tag{background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);color:var(--c,var(--accent))}
.ref{background:var(--surface2)}
.ansrow input{background:var(--surface2);border:2px solid transparent;border-radius:12px}
.ansrow input.act{border-color:var(--c,var(--accent));box-shadow:none}
.kp{background:var(--bg2);border-top:0}
.kp button{border:0;background:var(--surface);box-shadow:0 2px 0 color-mix(in srgb,var(--surface) 50%,#000)}
.kp button.fn{background:var(--surface2);color:var(--accent)}
.kp button.ok{background:var(--c,var(--accent));color:var(--on)}
:root[data-skin="light"] .kp button{box-shadow:0 2px 0 var(--line)}
.fb.bad{background:var(--warn-soft)}
.fb.hint{background:var(--accent-soft)}
/* tab bar */
.tabbar{border-top:0;background:color-mix(in srgb,var(--bg2) 92%,transparent)}
.tabbar button{gap:3px}
.tabbar button svg{padding:3px 14px;width:52px;height:30px;border-radius:999px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{background:var(--accent-soft);color:var(--accent)}
/* misc */
.pick button{border:2px solid transparent;background:var(--surface)}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg button{border:0;background:var(--surface2)}
.u-search input,.nick input{background:var(--surface2);border:0}
.usug,.u-chips button,.reasons button{border:0;background:var(--surface2)}
.ta-hero{border:0;border-radius:18px}
.bossbox{border:0;border-radius:16px}
.heat i{border-radius:5px}
@media (max-width:360px){ .ptable{gap:5px} .el .sy{font-size:22px} .bigtile{width:96px;height:108px} .bigtile .sy{font-size:42px} }

/* ===== v2.1: 白×オレンジ、一本道の地図 ===== */
:root{ --brand:#ff8752; --accent:#ff9a6b; --accent-soft:#3e2c3f; }
:root[data-skin="light"]{ --brand:#e4572a; --accent:#d9542b; --accent-soft:#fde8de; --bg:#fbf9f7; --bg2:#f5f1ee; --surface:#ffffff; --surface2:#f6f2ef; --line:#ebe4df; --ink:#1f1a2e; --muted:#6d6577; --glow:#fde8de; --hero1:#fde8de; --hero2:#fbefe8; }
.btn{background:var(--brand);box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn:active{box-shadow:0 1px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn.boss{background:var(--brand)}
.kp button.ok{background:var(--brand)}
.ansrow input.act{border-color:var(--brand)}
.bar i,.goalline .bar i{background:var(--brand)}
.wgoal .bar i{background:var(--brand)}
.tabbar button[aria-current="page"] svg{background:var(--accent-soft);color:var(--brand)}
.lvl{color:var(--brand)}
.hero2{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent) 0,transparent 60%),var(--surface)}
:root[data-skin="light"] .hero2,:root[data-skin="light"] .today,:root[data-skin="light"] .card,:root[data-skin="light"] .rowcard,:root[data-skin="light"] .step{box-shadow:0 1px 2px rgba(60,30,20,.05),0 4px 14px rgba(60,30,20,.05)}
/* road map */
.chband{border:0;border-left:5px solid var(--c);border-radius:14px;background:var(--surface)}
.road{gap:34px;padding:14px 0 8px;position:relative}
.road svg.trail{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.road svg.trail path{fill:none;stroke:color-mix(in srgb,var(--c) 45%,var(--line));stroke-width:4;stroke-linecap:round;stroke-dasharray:1 10}
.stop{z-index:1}
.stop .t{position:relative;width:76px;height:84px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:2px solid color-mix(in srgb,var(--c) 50%,transparent)}
.stop .t .sy{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:-.02em}
.stop .t .lk{position:absolute;right:5px;bottom:5px;width:14px;height:14px;color:var(--muted)}
.stop .t .lk svg{width:14px!important;height:14px!important;display:block}
.stop.lock .t{opacity:.6;background:var(--surface)}
.stop.lock .t .sy{color:color-mix(in srgb,var(--c) 45%,var(--muted))}
.stop.done .t{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.stop.boss .t{width:124px;height:88px;border-radius:12px}
.stop.boss .t .sy{font-family:var(--font-display);font-weight:900}
.stop .lbl{background:color-mix(in srgb,var(--bg) 80%,transparent);border-radius:6px;padding:0 4px}
.stop.cur::before{background:var(--brand);color:#fff}
.stop .hot{border-radius:4px}
.stop .hot.wk{background:var(--brand);border-color:var(--brand);color:#fff}
/* ===== v2.2: 文字を減らす ===== */
.pill{flex:none;font-family:var(--font-display);font-weight:700;font-size:14px;min-width:34px;text-align:center;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.pill.hot{background:var(--brand);color:#fff}
.pill.lockp{color:var(--muted);display:grid;place-items:center}
.pill.lockp svg{width:16px!important;height:16px!important}
.rowcard .body .t{font-size:16px}
.today{padding:12px 14px}
.today summary{list-style:none;cursor:pointer;border-bottom:0;padding-bottom:0}
.today summary::-webkit-details-marker{display:none}
.today[open] summary{border-bottom:1px solid var(--line);padding-bottom:10px}
.week{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
:root[data-skin="light"] .week{box-shadow:0 1px 2px rgba(60,30,20,.05),0 4px 14px rgba(60,30,20,.05)}
.wk-h{display:flex;justify-content:space-between;align-items:center}
.wk-h b{font-size:16px}
.btn.icon{padding:4px;width:32px;height:32px;display:grid;place-items:center}
.btn.icon svg{width:20px;height:20px}
.wk-row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.wk-k{font-size:14px;font-weight:700;color:var(--muted)}
.wk-row .bar{margin:0;height:10px;border-radius:5px}
.wk-n{font-family:var(--font-display);font-weight:700;font-size:15px}
.wk-units{display:flex;flex-wrap:wrap;gap:4px}
.wk-units span{font-size:13.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface2)}
.wk-units span.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.wk-tip,.wk-last{margin:0;font-size:13.5px;color:var(--muted)}
.wk-tip b{color:var(--warn)}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.bchips span{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.bchips span.x{background:var(--brand);color:#fff}
.bchips .h svg{width:16px;height:16px}
.btn svg{width:16px;height:16px;vertical-align:-2px}
.route .d{font-size:13.5px;color:var(--muted)}
.ob .pick button{align-items:center;padding:16px}
.ob .pick button b{font-size:18px}

/* ===== paywall ===== */
.pay{display:flex;flex-direction:column;gap:12px}
.pay-h{display:flex;align-items:center;gap:8px}
.pay-h .crown{width:28px;height:28px;color:var(--gold)}
.pay-h h2{font-size:22px}
.pay-f{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pay-f li{display:flex;align-items:center;gap:10px;font-weight:700}
.pay-f .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--brand)}
.pay-f .ic svg{width:18px;height:18px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:inherit;color:var(--ink)}
.plan.on{border-color:var(--brand);background:var(--accent-soft)}
.pl-k{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.pl-k i{font-style:normal;font-size:13.5px;color:#fff;background:var(--brand);border-radius:4px;padding:1px 5px}
.pl-p{font-family:var(--font-display);font-weight:900;font-size:22px}
.pl-p small{font-size:13.5px;font-weight:700;color:var(--muted)}
.pl-s{font-size:13.5px;color:var(--muted)}
.pay-l{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.pay-l .btn{font-size:13.5px}
.stop .pm{position:absolute;top:-4px;left:50%;transform:translateX(26px);width:18px;height:18px;color:var(--gold);z-index:2}
.stop .pm svg,.pm2 svg{width:100%;height:100%;display:block}
.pm2{display:inline-block;width:16px;height:16px;color:var(--gold);vertical-align:-2px}
.mrow .pm2{margin-left:auto}
.nk{flex:1;font-size:16px;padding:8px 0}
.linkrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left}
.btn svg{display:inline-block}
.btn svg[style],.bchips svg[style]{width:18px!important;height:18px!important;vertical-align:-3px}

/* ===== 分野の切り替え・色見本 ===== */
.tracks{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface2);margin:0 0 8px}
.tracks button{flex:1;border:0;background:none;border-radius:999px;padding:8px 0;font:inherit;font-weight:700;font-size:14px;color:var(--muted)}
.tracks button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(60,30,20,.12)}
.tracks button:disabled{opacity:.55}
.tracks small{display:block;font-size:13.5px;font-weight:700;margin-top:-2px}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:6px;border:1px solid rgba(0,0,0,.12)}
.sw.wh{border-color:var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw.none{border:1.5px dashed var(--muted)}
.choices .btn{line-height:1.5}

/* ===== 有機: ベンゼン環の図 ===== */
.bz{display:block;flex:none;color:var(--ink)}
.bzc{display:flex;align-items:center;gap:8px;text-align:left}
.choices .btn .bz{margin:0 auto}
.choices .btn .bzc .bz{margin:0}
.btn svg.bz{width:auto;height:auto;vertical-align:middle;stroke:currentColor}
.choices .btn:has(> svg.bz){padding:6px 0}
.bzc{gap:4px}

/* ===== ユニバーサルデザイン（最後に読み込んで上書き） =====
   文字と背景のコントラスト比 4.5 以上、押せる範囲 40px 以上、最小文字 12px、色だけで区別しない */
:root[data-skin="light"]{ --brand:#c2410c; --accent:#b93f12; --muted:#5f5869; --gold-ink:#7a5600; --ok:#0b6e49; --warn:#9a4a07; --heart:#b4233c; --on-brand:#ffffff; }
:root[data-skin="dark"]{ --gold-ink:#f5c84b; --on-brand:#1a1020; }
:root{ --on-brand:#ffffff; }
body{letter-spacing:.02em;font-feature-settings:"palt" 0}
h1,h2,h3,.apphead h1{font-weight:700}
.btn{color:var(--on-brand)}
:root[data-skin="dark"] .btn{color:var(--on-brand)}
:root[data-skin="dark"] .choices .btn,:root[data-skin="dark"] .btn.ghost,:root[data-skin="dark"] .btn.text{color:var(--ink)}
.choices .btn,.btn.ghost,.btn.text{color:var(--ink)}
.pill.hot,.stop.cur::before,.stop .hot.wk,.pay i,.pay .rec{color:var(--on-brand)}
.lvl,.chip.xp,.num.gold{color:var(--gold-ink)}
.btn.danger,.danger{color:var(--heart)}
/* 選んでまちがえた選択肢: 色に頼らず × と取り消し線 */
.choices .btn.ng{opacity:1;background:var(--surface);border:2px dashed var(--muted);color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.choices .btn.ng .mk{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--muted);color:var(--surface);font-weight:700;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 押せる範囲 */
.btn.text[aria-label],.btn.text.icon,.close,.x{min-width:44px;min-height:44px}
.seg button,.u-chips button,.tracks button,.btn.text{min-height:40px}
.u-chips button{padding:8px 14px}
.rep{display:inline-flex;align-items:center;min-height:40px;padding:6px 2px}
.tracks button{min-height:44px;font-size:15px}
/* フォーカスをはっきり */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.set-row:has(> .seg){flex-direction:column;align-items:stretch;gap:8px}
.set-row > .seg{display:flex;width:100%}
.set-row > .seg button{flex:1;white-space:nowrap}
.lead,.ob p,.hello{text-wrap:pretty}

/* まちがいノート */
.note{padding:0;overflow:hidden}
.note-h{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 16px;font:inherit;color:var(--ink);min-height:56px}
.nrow{display:flex;align-items:center;gap:10px}
.nd{color:var(--muted);font-size:14px;flex:none}
.nt{font-weight:700;flex:1;min-width:0}
.nb{flex:none;font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.nb.ng{background:var(--warn-soft);color:var(--warn)}
.nb.ok{background:var(--ok-soft);color:var(--ok)}
.nq{display:block;margin-top:6px;font-size:14px;color:var(--muted);line-height:1.6}
.nbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.nbody .q{margin-top:12px}
.nsteps{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.nsteps li{background:var(--surface2);border-radius:12px;padding:12px}
.nsteps .np{margin:2px 0 6px}
.nmine,.nans{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:6px;flex-wrap:wrap}
.nmine{color:var(--warn)}
.nans{color:var(--ok)}
.nsteps .mk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--warn);color:var(--surface);font-size:14px;flex:none}
.nsteps .mk.ok{background:var(--ok)}
.nex{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.7}
.nf{width:100%}
.nf button{flex:1}
.card.ask{text-align:left;border:2px solid var(--brand)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.sel{font:inherit;font-size:16px;padding:8px 12px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sel:disabled{opacity:.5}

/* 分野タブの色 */
.tracks .tdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}
.tracks button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--tc),0 1px 3px rgba(60,30,20,.12)}
/* 連続記録 */
.streak{padding:14px 16px}
.sk-top{display:flex;align-items:center;gap:12px}
.sk-fire svg{width:40px;height:40px;color:#e8590c;display:block}
:root[data-skin="dark"] .sk-fire svg{color:#ff9a5c}
.sk-fire.off svg{color:var(--line)}
.sk-num{display:flex;align-items:baseline;gap:4px;flex:none}
.sk-num b{font-size:34px;line-height:1;font-family:var(--font-mono)}
.sk-num span{font-weight:700;font-size:15px}
.sk-msg{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.streak.done .sk-msg{color:var(--ok);font-weight:700}
.sk-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.sk-d{display:flex;flex-direction:column;align-items:center;gap:4px}
.sk-w{font-size:13.5px;color:var(--muted);font-weight:700}
.sk-c{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-weight:700;color:var(--surface)}
.sk-d.on .sk-c{background:#e8590c;border-color:#e8590c}
:root[data-skin="light"] .sk-d.on .sk-c{background:#c2410c;border-color:#c2410c;color:#fff}
.sk-d.t .sk-c{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.sk-d.f .sk-c{border-style:dashed;opacity:.6}
.sk-next{margin-top:12px;font-size:14px;color:var(--muted);font-weight:700}
.sk-next .bar{margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.bdg{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:12px;background:var(--surface2);color:var(--muted)}
.bdg .bf svg{width:22px;height:22px;opacity:.35}
.bdg b{font-size:20px;line-height:1.2}
.bdg small{font-size:13.5px}
.bdg.on{background:var(--warn-soft);color:var(--ink)}
.bdg.on .bf svg{opacity:1;color:#c2410c}
/* 連続記録のお祝い（押さなくても消える） */
#streakpop{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;
  background:var(--surface);color:var(--ink);border:2px solid #c2410c;border-radius:16px;padding:10px 18px 10px 12px;box-shadow:0 10px 30px rgba(60,30,20,.2);max-width:calc(100% - 28px)}
#streakpop .sp-fire svg{width:36px;height:36px;color:#c2410c;display:block}
#streakpop{width:max-content}
#streakpop .sp-t{display:flex;flex-direction:column;white-space:nowrap}
#streakpop b{font-size:18px}
#streakpop small{font-size:14px;color:var(--muted)}
#streakpop.out{opacity:0;transition:opacity .4s}
@media (prefers-reduced-motion: no-preference){
  #streakpop{animation:spin .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes spin{from{transform:translate(-50%,-30px) scale(.9);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
  #streakpop .sp-fire svg{animation:flick 1s ease-in-out 2}
  @keyframes flick{50%{transform:scale(1.15)}}
}

/* 解説タイム */
.ex-h{font-weight:700;font-size:17px}
.ex-dots{display:flex;gap:6px;margin-left:auto}
.ex-dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.ex-dot.ok{background:var(--ok)}
.ex-dot.ng{background:var(--warn)}
.ex-dot.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ex-s{font-size:16px;margin:0 0 8px}
.ex-ans{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;margin-top:6px;font-size:17px;flex-wrap:wrap}
.explain .mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--warn);color:var(--surface);font-size:14px;flex:none;font-weight:700}
.explain .mk.ok{background:var(--ok)}
.ex-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.ex-steps li{background:var(--surface2);border-radius:12px;padding:12px;border:2px solid transparent}
.ex-steps li.miss{border-color:var(--warn)}
.ex-l{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.ex-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:14px;flex:none}
.ex-p{margin:6px 0 0}
.ex-why,.ex-calc{margin-top:8px;line-height:1.75;font-size:15px}
.ex-why b,.ex-calc b{display:inline-block;font-size:13.5px;padding:1px 8px;border-radius:999px;margin-right:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.ex-a{margin-top:8px;font-weight:700;color:var(--ok)}
.ex-ul{margin:0;padding-left:1.2em;line-height:1.8}
.ex-mine{border:2px solid var(--warn)}
.ex-mine ul{margin:0;padding-left:1.2em;line-height:1.8;font-weight:700}
.ex-guide p{margin:0 0 8px;line-height:1.8}
.ex-f{background:var(--surface2);border-left:4px solid var(--brand);padding:10px 12px;border-radius:8px;margin:8px 0;font-weight:700;line-height:1.8}
.ex-tb{margin-top:10px}
.ex-tb summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.gt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.gt th,.gt td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.gt th{color:var(--muted);font-size:14px}
.explain .nmine{display:grid;grid-template-columns:24px 1fr;align-items:start;gap:8px}
.ex-ch{margin-top:10px}
.ex-ch > b{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.ex-c{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line);line-height:1.6}
.ex-c.ok{color:var(--ok);font-weight:700}
.ex-c.ng{color:var(--warn);font-weight:700;text-decoration:line-through}
.ex-c .mk2{text-align:center;font-weight:700}
.ex-tb summary::before{content:"▸";margin-right:8px;transition:transform .2s}
.ex-tb[open] summary::before{transform:rotate(90deg)}

/* データの保存 */
.sec{font-size:16px;margin:0 0 10px}
.sub{font-size:14px;margin:16px 0 4px}
.sm{font-size:14px;line-height:1.7}
.stack-s{display:flex;flex-direction:column;gap:8px}
.filebtn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.autos{list-style:none;margin:0;padding:0}
.autos li{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.autos li span{display:flex;flex-direction:column;font-weight:700}
.autos small{font-weight:400;color:var(--muted);font-size:14px}
.siwa,.siwg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:10px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:4px}
.siwa{background:#000;color:#fff;border:0}
:root[data-skin="dark"] .siwa{background:#fff;color:#000}
.siwa svg{width:20px;height:20px}
.siwg{background:#fff;color:#1f1f1f;border:1px solid #747775}
.siwg svg{width:20px;height:20px}
.acct{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.acct span:last-child{display:flex;flex-direction:column}
.acct small{color:var(--muted);font-size:14px}
.acct-ic svg{width:28px;height:28px;display:block}
.choicebox{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;padding:14px;margin-bottom:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.choicebox span{color:var(--muted);font-size:14px}
.danger-fill{background:var(--heart);color:#fff}

/*FINAL-CSS*/
/* =====================================================================
   化学クエスト デザイン層「フラスコと丸いステージ」
   方針
   ・白い面に、押したくなる立体のボタン（下に4pxの厚み）。角は大きく丸く、文字は丸ゴシックの太字
   ・色は意味ごとに1色: オレンジ＝進む、緑＝正解・理論、灰青＝無機、紫＝ボス、赤＝まちがい・ハート
   ・マップは丸いコインの一本道。今いる場所にはマスコットのフラスコがいる
   ・枠は2pxの薄い灰色。影のぼかしは使わず、厚みは「下の色の帯」で表す
   ===================================================================== */
:root{
  --font-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --font-mono:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --r-l:16px; --r-m:14px; --r-s:10px;
}
:root[data-skin="light"]{
  --bg:#ffffff; --bg2:#ffffff; --surface:#ffffff; --surface2:#f7f7f7; --surface-2:#f7f7f7; --ink:#3c3c3c; --muted:#6b6b6b; --line:#e5e5e5; --line2:#d4d4d4; --rule:#3c3c3c;
  --brand:#ff9600; --btn:#e66f00; --btn-sh:#b35500; --on-brand:#ffffff; --on:#ffffff; --accent:#a84c00; --accent-soft:#fff3e3; --accent-line:#ffc98a;
  --ok:#2a7d00; --okf:#46a302; --ok-sh:#327a00; --ok-soft:#e5f8d4; --okl:#a5e07c;
  --warn:#9a5200; --warn-soft:#fff3d6; --bad:#c62828; --bad-soft:#ffe4e4; --badl:#ffb3b3;
  --gold:#ffc800; --gold-ink:#8a6400; --gold-soft:#fff6d1; --boss:#7c3fc0; --bossf:#a560e8; --boss-sh:#7c3fc0; --boss-soft:#f4eaff;
  --heart:#ff4b4b; --blue:#126aa0; --blue-soft:#ddf4ff; --hero1:#fff; --hero2:#fff; --glow:#fff; --grid:transparent;
}
:root[data-skin="dark"]{
  --bg:#131f24; --bg2:#131f24; --surface:#131f24; --surface2:#1c2b33; --surface-2:#1c2b33; --ink:#f1f7fb; --muted:#a3b3bc; --line:#37464f; --line2:#2b3a42; --rule:#f1f7fb;
  --brand:#ff9600; --btn:#e66f00; --btn-sh:#a34f00; --on-brand:#ffffff; --on:#ffffff; --accent:#ffad52; --accent-soft:#2e2414; --accent-line:#7a4a12;
  --ok:#86dd45; --okf:#46a302; --ok-sh:#2f6e00; --ok-soft:#1d3317; --okl:#3f6b22;
  --warn:#ffc061; --warn-soft:#33281a; --bad:#ff8a8a; --bad-soft:#3a2023; --badl:#7a3036;
  --gold:#ffc800; --gold-ink:#ffd84d; --gold-soft:#332c12; --boss:#cfa8ff; --bossf:#9a52e0; --boss-sh:#6d32ad; --boss-soft:#2a2038;
  --heart:#ff6b6b; --blue:#49c0f8; --blue-soft:#17323f; --hero1:#131f24; --hero2:#131f24; --glow:#131f24; --grid:transparent;
}
body{background:var(--bg)!important;background-image:none!important;letter-spacing:.01em;font-weight:500;-webkit-font-smoothing:antialiased}
b,strong,h1,h2,h3,.btn,button{font-weight:700}
h1,h2,h3{font-weight:700;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-top:2px}
.stack{gap:14px}
.muted{color:var(--muted)}

/* ---------- 見出し ---------- */
.apphead{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.apphead h1{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700}
.logo{display:inline-block;width:34px;height:38px;background:none!important;border:0!important;padding:0!important}
.logo svg{width:100%;height:100%;display:block}
.lvl{display:flex;align-items:center;gap:6px;background:var(--gold-soft)!important;border:2px solid var(--gold)!important;border-radius:999px!important;padding:2px 12px 2px 10px!important;color:var(--gold-ink)!important;font-weight:700;font-size:17px}
.lvl small{font-size:13.5px;font-weight:700;color:var(--gold-ink)}
.playtop h2{font-size:18px}

/* ---------- 面（カード） ---------- */
.card,.rowcard,.list,.week,.streak,.today,.qcard,.goalline,.mini,.stat,.chap{background:var(--surface)!important;border:2px solid var(--line)!important;border-radius:var(--r-l)!important;box-shadow:none!important}
.card.ask,.ex-mine{border-color:var(--accent-line)!important;background:var(--accent-soft)!important}
.sheet{background:rgba(0,0,0,.45)!important;backdrop-filter:none!important}
.sheet > .card{border-radius:24px 24px 0 0!important;border:0!important;padding:22px 18px calc(18px + env(safe-area-inset-bottom))!important}

/* ---------- ボタン（立体） ---------- */
.btn{position:relative;border:0!important;border-radius:var(--r-m)!important;background:var(--btn)!important;color:#fff!important;box-shadow:0 4px 0 var(--btn-sh)!important;font-weight:700;font-size:19px;letter-spacing:.04em;min-height:52px;padding:10px 18px;transition:transform .05s,box-shadow .05s;margin-bottom:4px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--btn-sh)!important}
.btn.ghost,.choices .btn{background:var(--surface)!important;color:var(--ink)!important;border:2px solid var(--line)!important;box-shadow:0 4px 0 var(--line)!important;font-size:17px}
.btn.ghost:active,.choices .btn:active{box-shadow:0 0 0 var(--line)!important}
.btn.boss{background:var(--bossf)!important;box-shadow:0 4px 0 var(--boss-sh)!important;color:#fff!important}
.btn.okb{background:var(--okf)!important;box-shadow:0 4px 0 var(--ok-sh)!important;color:#fff!important}
.btn.text{background:transparent!important;border:0!important;box-shadow:none!important;color:var(--accent)!important;text-decoration:none;min-height:44px;font-size:16px;margin-bottom:0}
.btn.text:active{transform:none}
.btn.text.danger,.btn.danger{color:var(--bad)!important}
.btn.danger-fill{background:#e03a3a!important;color:#fff!important;box-shadow:0 4px 0 #a51f1f!important}
.btn:disabled,.btn[disabled]{background:var(--line)!important;color:var(--muted)!important;box-shadow:0 4px 0 var(--line2)!important;border:0!important;opacity:1!important;transform:none!important}
.btn.full{width:100%}
.btn svg{width:20px;height:20px;vertical-align:-3px}
.row2{gap:12px!important}
.linkrow2{display:flex;justify-content:center;gap:28px}
.choices{gap:12px!important}
.choices .btn{text-align:left;justify-content:flex-start;padding:12px 16px;line-height:1.5;min-height:56px;font-weight:700}
.choices .btn.ng{box-shadow:0 4px 0 var(--badl)!important;border-color:var(--badl)!important;background:var(--bad-soft)!important;color:var(--bad)!important;text-decoration:line-through}
.choices .btn.ok,.choices .btn.right{border-color:var(--okl)!important;box-shadow:0 4px 0 var(--okl)!important;background:var(--ok-soft)!important;color:var(--ok)!important}

/* ---------- 切り替え ---------- */
.seg{display:inline-flex;gap:6px!important;border:0;background:none;padding:0}
.seg button{border-radius:12px!important;border:2px solid var(--line)!important;background:var(--surface)!important;color:var(--muted)!important;box-shadow:0 3px 0 var(--line)!important;font-weight:700;padding:6px 14px;margin-bottom:3px}
.seg button[aria-pressed="true"]{border-color:var(--blue)!important;background:var(--blue-soft)!important;color:var(--blue)!important;box-shadow:0 3px 0 var(--blue)!important}

/* ---------- ラベル類 ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;background:none!important;border:0!important;padding:0!important;color:var(--muted)!important;font-weight:700;font-size:14px!important}
.tag::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cv,var(--brand))}
.tag.f::before{background:var(--bossf)}
.pill{border-radius:999px!important;background:var(--surface2)!important;color:var(--ink)!important;box-shadow:none!important;border:2px solid var(--line);font-weight:700;padding:1px 10px!important}
.pill.hot{background:var(--btn-sh)!important;border-color:var(--btn-sh)!important;color:#fff!important}
.nb{border-radius:999px!important;font-weight:700}
.chip{border-radius:999px!important}
.bchips span,.u-chips button,.tchip{border-radius:999px!important}
.u-chips button{border:2px solid var(--line)!important;box-shadow:0 3px 0 var(--line);background:var(--surface)!important;font-weight:700}
.u-chips button.on{border-color:var(--blue)!important;box-shadow:0 3px 0 var(--blue);background:var(--blue-soft)!important;color:var(--blue)!important}

/* ---------- 下のタブ ---------- */
.tabbar{background:var(--surface)!important;backdrop-filter:none!important;border-top:2px solid var(--line)!important;box-shadow:none!important}
.tabbar .in{padding:6px 8px!important;gap:4px}
.tabbar button{position:relative;color:var(--muted)!important;gap:2px!important;padding:5px 0 4px!important;border:2px solid transparent!important;border-radius:14px!important;font-size:13.5px!important;font-weight:700}
.tabbar .tico{display:block;width:30px;height:30px}
.tabbar .tico svg{width:30px!important;height:30px!important;display:block;background:none!important;padding:0!important}
.tabbar button[aria-current="page"]{color:var(--accent)!important;border-color:var(--accent-line)!important;background:var(--accent-soft)!important}
.tabbar button[aria-current="page"]::before{display:none}

/* ---------- 分野タブ ---------- */
.tracks{background:none!important;border:0!important;box-shadow:none!important;gap:8px!important;padding:0!important}
.tracks button{border:2px solid var(--line)!important;border-radius:14px!important;background:var(--surface)!important;box-shadow:0 3px 0 var(--line)!important;color:var(--muted)!important;font-weight:700;min-height:44px;margin-bottom:3px}
.tracks button[aria-selected="true"]{border-color:var(--tc)!important;color:var(--ink)!important;box-shadow:0 3px 0 var(--tc)!important;background:color-mix(in srgb,var(--tc) 10%,var(--surface))!important}
.tracks .tdot{width:12px!important;height:12px!important;border-radius:50%!important}

/* ---------- マスコットのふきだし ---------- */
.say{display:flex;align-items:center;gap:10px;margin:2px 0}
.say-m{flex:none;width:72px;height:78px}
.say-m svg{width:100%;height:100%;display:block}
.say-b{position:relative;margin:0;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);padding:12px 14px;font-weight:700;font-size:16px;line-height:1.55;color:var(--ink)}
.say-b::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.home-say .say-m{width:60px;height:66px}
.home-say .say-b{font-size:15px;padding:10px 12px}

/* ---------- ホーム ---------- */
.hero2{background:var(--c)!important;border:0!important;border-radius:20px!important;box-shadow:0 5px 0 var(--cs)!important;padding:16px!important;color:#fff;margin-bottom:5px}
.hero2 .hrow{gap:14px;align-items:center}
.hero2 .bigtile{width:84px!important;height:78px!important;border-radius:50%!important;border:0!important;background:#fff!important;box-shadow:0 5px 0 rgba(0,0,0,.18)!important;display:grid!important;place-items:center;flex:none}
.hero2 .bigtile .sy{color:var(--cs)!important;font-size:32px!important;font-weight:700!important;margin:0!important}
.hero2 .bigtile.boss{background:rgba(255,255,255,.95)!important}
.hero2 .bigtile.boss .face svg{width:62px;height:62px}
.hero2 .hk{color:#fff!important;opacity:1;font-weight:700;font-size:14px}
.hero2 h2{color:#fff!important;font-size:22px;line-height:1.3;margin:2px 0 8px}
.hero2 .strip{gap:5px}
.hero2 .strip i{height:10px!important;border-radius:999px!important;background:rgba(0,0,0,.2)!important;border:0!important}
.hero2 .strip i.on{background:#fff!important}
.hero2 .strip i.cur{background:rgba(255,255,255,.55)!important;outline:0}
.hero2 .btn.go{background:#fff!important;color:var(--cs)!important;box-shadow:0 4px 0 rgba(0,0,0,.2)!important;margin-top:14px}
.streak{padding:14px 16px!important}
.sk-fire{color:var(--brand)!important}
.sk-fire.off{color:var(--line2)!important}
.sk-num b{font-size:30px!important;font-weight:700;color:var(--brand)}
.streak .sk-fire.off + .sk-num b{color:var(--muted)}
.sk-c{border-radius:50%!important;border:2px solid var(--line)!important;background:var(--surface)!important}
.sk-d.on .sk-c{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}
.sk-d.t .sk-c{border-color:var(--brand)!important}
.today{padding:0!important}
.tstats{display:grid!important;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;padding:14px 16px!important;list-style:none;cursor:pointer}
.tstats::-webkit-details-marker{display:none}
.tm{display:flex;flex-direction:column;gap:5px;min-width:0}
.tm .tl{font-size:14px;font-weight:700;color:var(--muted)}
.tm b.num{font-size:24px;line-height:1;font-weight:700}
.tm b.num small{font-size:14px;color:var(--muted);margin-left:2px}
.meter{display:flex;gap:4px;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.meter > b{display:block;background:var(--gold);height:100%;border-radius:999px;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.meter.parts{background:none;gap:5px}
.meter.parts > b{flex:1;background:var(--line);border-radius:999px;box-shadow:none}
.meter.parts > b.on{background:var(--okf);box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.tmore{font-size:14px;font-weight:700;color:var(--blue);align-self:center}
.mlist{border-top:2px solid var(--line);padding:6px 16px 12px!important}
.mission{border-radius:0!important;background:none!important;border-bottom:2px solid var(--line)}
.mission:last-of-type{border-bottom:0}
.mission .chk{border-radius:50%!important;border:2px solid var(--line)!important}
.mission.ok .chk{background:var(--okf)!important;border-color:var(--okf)!important;color:#fff!important}
.goalline{padding:14px 16px!important}
.bar{height:14px!important;border-radius:999px!important;background:var(--line)!important;box-shadow:none!important;overflow:hidden}
.bar i{border-radius:999px!important;background:var(--okf);box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}

/* ---------- 一覧の行 ---------- */
.rowcard{min-height:64px;box-shadow:0 4px 0 var(--line)!important;margin-bottom:4px}
.rowcard:active{transform:translateY(4px);box-shadow:none!important}
.rowcard .ic{background:color-mix(in srgb,var(--c,var(--brand)) 14%,var(--surface))!important;color:var(--c,var(--accent))!important;border:0!important;border-radius:12px!important;width:42px!important;height:42px!important}
.rowcard .t{font-weight:700}
.course{border-bottom:0!important;color:var(--muted)!important;font-weight:700;margin-top:14px!important}

/* ---------- マップ: 上の数字 ---------- */
.status{background:var(--bg)!important;backdrop-filter:none!important;border-bottom:2px solid var(--line);box-shadow:none!important}
.topstats{display:flex!important;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px!important}
.tsx{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;color:var(--muted)}
